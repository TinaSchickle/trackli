name: Tages-Erinnerung

# Prüft alle 30 Minuten, ob für Nutzer:innen mit aktivierter Erinnerung gerade
# ihre eingestellte Uhrzeit (Europe/Berlin, Halbstundenschritte) erreicht ist
# und ob noch aktive Module (Temperatur, Zervixschleim, Muttermund,
# Spucke-Test) für heute fehlen – falls ja, schickt eine Push-Benachrichtigung
# ans Handy (siehe scripts/send-daily-reminders.mjs).

on:
  schedule:
    - cron: '*/30 * * * *' # jede halbe Stunde UTC; das Skript filtert selbst auf die Wunschzeit je Nutzer
  workflow_dispatch:
    inputs:
      force:
        description: 'Sofort senden, unabhängig von der Uhrzeit (zum Testen)'
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/send-daily-reminders.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: mailto:tina.schickle@gmx.de
          FORCE_RUN: ${{ inputs.force }}
