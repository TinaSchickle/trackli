name: Zervixschleim-Erinnerung

# Prüft stündlich, ob es für eingeloggte Nutzer:innen mit aktivierter
# Erinnerung gerade 20 Uhr (Europe/Berlin) ist und heute noch kein
# Zervixschleim-Wert eingetragen wurde – falls ja, schickt eine Push-
# Benachrichtigung ans Handy (siehe scripts/send-mucus-reminders.mjs).

on:
  schedule:
    - cron: '0 * * * *' # jede volle Stunde UTC; das Skript filtert selbst auf 20 Uhr Ortszeit
  workflow_dispatch:
    inputs:
      force:
        description: 'Sofort senden, unabhängig von der Uhrzeit (zum Testen)'
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/send-mucus-reminders.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: mailto:tina.schickle@gmx.de
          FORCE_RUN: ${{ inputs.force }}
